  }
</script>
<style>
  html,body{background:#111;color:#f4f4f4;font-family:Inter,sans-serif}
  .gold-gradient{background:linear-gradient(135deg,#C8A74E,#E9D08A,#C8A74E);-webkit-background-clip:text;background-clip:text;color:transparent}

  .gold-glow{box-shadow:0 0 40px -12px rgba(200,167,78,.35)}

  .btn-primary:hover{background:#E9D08A}
  .btn-outline{border:1px solid #C8A74E;color:#C8A74E}

  .toggle{border:1px solid #252525;background:rgba(31,31,31,.6);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;color:#8b8b8b;display:flex;justify-content:space-between;align-items:center}
  .toggle.on{border-color:#C8A74E;background:rgba(200,167,78,.1);color:#C8A74E}
  .dot{width:14px;height:14px;border-radius:99px;border:1px solid #252525}
  .toggle.on .dot{background:#C8A74E;border-color:#C8A74E}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid}
  .b-amber{background:rgba(245,158,11,.12);color:#fbbf24;border-color:rgba(245,158,11,.3)}
  .b-emerald{background:rgba(16,185,129,.12);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
  .b-blue{background:rgba(59,130,246,.12);color:#93c5fd;border-color:rgba(59,130,246,.3)}
  .b-gold{background:rgba(200,167,78,.12);color:#C8A74E;border-color:rgba(200,167,78,.35)}
  .b-red{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.3)}
  .b-green{background:rgba(16,185,129,.12);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
  .side-btn{width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;color:#8b8b8b;display:flex;align-items:center;gap:10px}
  .side-btn:hover{background:rgba(255,255,255,.03);color:#f4f4f4}
  .side-btn.active{background:rgba(200,167,78,.1);color:#C8A74E;border:1px solid rgba(200,167,78,.3)}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8b8b;text-align:left;padding:10px;border-bottom:1px solid #252525}
  .tbl td{padding:10px;border-bottom:1px solid rgba(37,37,37,.6)}
  .tbl tr:hover td{background:rgba(255,255,255,.02)}
  .toast{position:fixed;top:20px;right:20px;padding:12px 16px;border-radius:10px;background:#181818;border:1px solid rgba(200,167,78,.4);color:#f4f4f4;z-index:99;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.err{border-color:rgba(239,68,68,.5)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .scroll{scrollbar-width:thin;scrollbar-color:rgba(200,167,78,.3) transparent}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(200,167,78,.3);border-radius:3px}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.5)}
  @media print { .no-print{display:none} }
</style>
</head>
<body class="min-h-screen">

<div id="app"></div>

<script>
/* ===============================================================
   ESSENCIALY — CRM standalone com backend em Google Sheets
   =============================================================== */

const STATUS_META = {
  AGUARDANDO_TRIAGEM:{label:'Aguardando Triagem',cls:'b-amber'},
  EM_ATENDIMENTO:{label:'Em Atendimento',cls:'b-blue'},
  FINALIZADO:{label:'Finalizado',cls:'b-emerald'},
  RETORNO_AGENDADO:{label:'Retorno Agendado',cls:'b-blue'},
};
const ROLES = {
  ADMIN:{label:'Administrador'},
  RECEPCAO:{label:'Recepção'},
  OPTOMETRISTA:{label:'Optometrista'},
};

const state = {
  user: null,           // {id, username, nome, role}
  token: '',            // auth token from Apps Script
  apiUrl: '',           // Apps Script Web App URL
  view: 'dashboard',
  patients: [],
  loading: false,
  selectedPatientId: null,
  detailPatientId: null,
  triagemForm: null,
  triagemTab: 'dados',
  searchQ: '',
  consultForm: null,
  authTab: 'login',     // 'login' | 'signup'
};

/* ---------- Persistence helpers ---------- */
function saveLocal(){
  localStorage.setItem('ess_user', JSON.stringify(state.user||null));
  localStorage.setItem('ess_token', state.token||'');
  localStorage.setItem('ess_api', state.apiUrl||'');
}
function loadLocal(){
  try { state.user = JSON.parse(localStorage.getItem('ess_user')||'null'); } catch { state.user=null }
  state.token = localStorage.getItem('ess_token')||'';
  state.apiUrl = localStorage.getItem('ess_api')||'';
}

/* ---------- Password hashing (SHA-256 hex) ---------- */
async function hashPassword(pw){
  const enc = new TextEncoder().encode('essenciary:'+pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------- API (Google Apps Script) ---------- */
async function apiGetPatients(){
  if(!state.apiUrl) return [];
  const r = await fetch(state.apiUrl + '?token=' + encodeURIComponent(state.token), { method:'GET' });
  const j = await r.json();
  if(!j.ok){ if(j.error==='auth'){ handleAuthExpired(); } throw new Error(j.error||'Erro ao buscar'); }
  return (j.patients||[]).map(normalizeFromSheet);
}
async function apiPost(payload){
  if(!state.apiUrl) throw new Error('URL da planilha não configurada');
  const r = await fetch(state.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return await r.json();
}
async function apiUpsertPatient(patient){
  const j = await apiPost({ action:'upsert', token: state.token, patient });
  if(!j.ok){ if(j.error==='auth') handleAuthExpired(); throw new Error(j.error||'Erro ao salvar'); }
  return j.patient;
}
async function apiRegister(user){
  const j = await apiPost({ action:'register', user });
  if(!j.ok) throw new Error(j.error||'Erro no cadastro');
  return j;
}
async function apiLogin(username, passwordHash){
  const j = await apiPost({ action:'login', username, passwordHash });
  if(!j.ok) throw new Error(j.error||'Falha ao entrar');
  return j;
}
function handleAuthExpired(){
  state.user = null; state.token = ''; saveLocal();
  toast('Sessão expirada — faça login novamente', true);
  render();
}

/* Fields that are booleans in UI, "SIM"/"" in the sheet */
const BOOL_FIELDS = ['dorDeCabeca','avPerto','avLonge','tontura','dorOcular','fotofobia',
  'diabetes','hipertensao','labirintite','glaucoma','pterigio','cirurgiaNosOlhos',
  'diabetesFamilia','hipertensaoFamilia','glaucomaFamilia'];

function normalizeFromSheet(p){
  const o = {...p};
  BOOL_FIELDS.forEach(k => { o[k] = (p[k]===true || String(p[k]||'').toUpperCase()==='SIM'); });
  return o;
}

/* ---------- Utility ---------- */
function calcAge(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const t=new Date(); let a=t.getFullYear()-d.getFullYear(); const m=t.getMonth()-d.getMonth(); if(m<0||(m===0&&t.getDate()<d.getDate())) a--; return a>=0&&a<130?String(a):''; }
function uuid(){ return 'p-' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function toast(msg, err=false){
  const el = document.createElement('div');
  el.className = 'toast ' + (err?'err':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function diffN(a,b){ const na=parseFloat(a), nb=parseFloat(b); if(isNaN(na)||isNaN(nb)) return null; return +(na-nb).toFixed(2); }

function emptyPatient(){ return {
  id:'', nome:'', dataCadastro:'', cpf:'', rg:'', dataNascimento:'', idade:'', endereco:'', cidade:'', telefone:'', observacao:'', status:'AGUARDANDO_TRIAGEM',
  dorDeCabeca:false,avPerto:false,avLonge:false,tontura:false,dorOcular:false,fotofobia:false,
  diabetes:false,hipertensao:false,labirintite:false,glaucoma:false,pterigio:false,cirurgiaNosOlhos:false,
  diabetesFamilia:false,hipertensaoFamilia:false,glaucomaFamilia:false,
  esfOdAnt:'',cilOdAnt:'',eixOdAnt:'',esfOeAnt:'',cilOeAnt:'',eixOeAnt:'',addAnt:'',
  esfAtualOd:'',cilAtualOd:'',eixAtualOd:'',esfAtualOe:'',cilAtualOe:'',eixAtualOe:'',addAtual:'',
  acuidadeLongeOd:'',acuidadePertoOd:'',acuidadeLongeOe:'',acuidadePertoOe:'',
  biocromoVerde:'',biocromoVermelho:''
}; }

async function reloadPatients(){
  try {
    state.loading = true; render();
    state.patients = await apiGetPatients();
  } catch(e){ toast('Erro: '+e.message, true); }
  finally { state.loading = false; render(); }
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  const root = document.getElementById('app');
  if(!state.apiUrl){ root.innerHTML = viewSetup(); attachSetupEvents(); return; }
  if(!state.user || !state.token){ root.innerHTML = viewLogin(); attachLoginEvents(); return; }
  root.innerHTML = viewShell();
  attachShellEvents();
}

function attachSetupEvents(){
  const btn = document.getElementById('save-api');
  if(btn) btn.onclick = () => {
    const v = document.getElementById('api-url').value.trim();
    if(!v || !v.includes('/exec')){ toast('URL inválida — precisa terminar em /exec', true); return; }
    state.apiUrl = v; saveLocal(); toast('Planilha conectada!'); render();
  };
}

/* ---------- Setup (first-time API URL) ---------- */
function viewSetup(){
  return `
  <div class="min-h-screen grid place-items-center p-6" style="background:radial-gradient(circle at 20% 30%,rgba(200,167,78,.15),transparent 50%),radial-gradient(circle at 80% 70%,rgba(200,167,78,.08),transparent 40%),#111">
    <div class="w-full max-w-lg luxury rounded-2xl p-8 gold-glow">
      <div class="flex items-center gap-3 mb-6">
        <div class="h-10 w-10 rounded-lg grid place-items-center border border-gold" style="background:linear-gradient(135deg,#1a1a1a,#0a0a0a)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8A74E" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div>
          <div class="font-serif text-lg gold-gradient tracking-[.25em]">ESSENCIALY</div>
          <div class="text-[10px] uppercase tracking-[.2em] text-muted">Optometria</div>
        </div>
      </div>
      <h1 class="font-serif text-2xl gold-gradient mb-1">Conectar Google Planilha</h1>
      <p class="text-sm text-muted mb-5">Cole aqui a URL do <b>Google Apps Script Web App</b> que você implantou (termina com <code>/exec</code>). Ele criará automaticamente as abas <b>Pacientes</b> e <b>Usuarios</b>.</p>
      <label class="label">URL do Web App</label>
      <input id="api-url" class="input mb-4" placeholder="https://script.google.com/macros/s/AKfy.../exec" />
      <button id="save-api" class="btn-primary w-full py-2.5 rounded-lg">Conectar</button>
      <div class="text-xs text-muted mt-4 leading-relaxed">
        <b class="text-gold">Como obter:</b> abra sua planilha Google → Extensões → Apps Script → cole o código <b>apps-script.gs</b> → Implantar → Novo → App da Web → Acesso: "Qualquer pessoa" → Copie a URL.
      </div>
    </div>
  </div>`;
}

/* ---------- Login / Cadastro ---------- */
function viewLogin(){
  const isSignup = state.authTab === 'signup';
  return `
  <div class="min-h-screen grid place-items-center p-6" style="background:radial-gradient(circle at 20% 30%,rgba(200,167,78,.25),transparent 50%),radial-gradient(circle at 80% 70%,rgba(200,167,78,.15),transparent 40%),#111">
    <div class="w-full max-w-md luxury rounded-2xl p-8 gold-glow">
      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-3">
          <div class="h-10 w-10 rounded-lg grid place-items-center border border-gold" style="background:linear-gradient(135deg,#1a1a1a,#0a0a0a)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8A74E" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div class="text-left">
            <div class="font-serif text-lg gold-gradient tracking-[.25em]">ESSENCIALY</div>
            <div class="text-[10px] uppercase tracking-[.2em] text-muted">Optometria</div>
          </div>
        </div>
        <h1 class="font-serif text-2xl gold-gradient mt-4">${isSignup?'Criar conta':'Bem-vindo(a)'}</h1>
        <p class="text-sm text-muted">${isSignup?'Cadastre seu usuário na clínica':'Acesse sua estação de trabalho'}</p>
      </div>

      <div class="flex gap-2 mb-5 bg-black/30 rounded-lg p-1">
        <button data-authtab="login"  class="flex-1 tab ${!isSignup?'active':''}">Login</button>
        <button data-authtab="signup" class="flex-1 tab ${isSignup?'active':''}">Cadastrar</button>
      </div>

      ${isSignup ? `
        <label class="label">Nome completo</label>
        <input id="su-nome" class="input mb-3" placeholder="Ex: Dra. Marina Silva" />
        <label class="label">Nome de usuário</label>
        <input id="su-user" class="input mb-3" placeholder="ex: marina.silva" autocapitalize="off" />
        <label class="label">Perfil</label>
        <select id="su-role" class="select mb-3">
          <option value="RECEPCAO">Recepção</option>
          <option value="OPTOMETRISTA">Optometrista</option>
          <option value="ADMIN">Administrador</option>
        </select>
        <label class="label">Senha</label>
        <input id="su-pass" type="password" class="input mb-4" placeholder="Mínimo 4 caracteres" />
        <button id="btn-signup" class="btn-primary w-full py-2.5 rounded-lg">Criar conta</button>
        <p class="text-[11px] text-center text-muted mt-3">O <b>primeiro usuário</b> cadastrado vira Administrador automaticamente.</p>
      ` : `
        <label class="label">Nome de usuário</label>
        <input id="li-user" class="input mb-3" placeholder="seu.usuario" autocapitalize="off" />
        <label class="label">Senha</label>
        <input id="li-pass" type="password" class="input mb-4" placeholder="••••••••" />
        <button id="btn-login" class="btn-primary w-full py-2.5 rounded-lg">Entrar</button>
      `}
      <div class="text-[11px] text-center text-muted mt-4">Dados salvos na sua planilha Google</div>
      <button id="reset-api" class="text-[11px] text-muted underline block mx-auto mt-3">Trocar planilha conectada</button>
    </div>
  </div>`;
}

function attachLoginEvents(){
  document.querySelectorAll('[data-authtab]').forEach(b => b.onclick = () => { state.authTab = b.dataset.authtab; render(); });

  const login = document.getElementById('btn-login');
  if(login) login.onclick = async () => {
    const username = (document.getElementById('li-user').value||'').trim().toLowerCase();
    const pass = document.getElementById('li-pass').value||'';
    if(!username || !pass){ toast('Preencha usuário e senha', true); return; }
    login.disabled = true; login.textContent = 'Entrando...';
    try {
      const hash = await hashPassword(pass);
      const j = await apiLogin(username, hash);
      state.user = j.user; state.token = j.token; saveLocal();
      toast('Bem-vindo(a), '+j.user.nome+'!');
      await reloadPatients(); render();
    } catch(err){ toast('Erro: '+err.message, true); login.disabled=false; login.textContent='Entrar'; }
  };

  const signup = document.getElementById('btn-signup');
  if(signup) signup.onclick = async () => {
    const nome = (document.getElementById('su-nome').value||'').trim();
    const username = (document.getElementById('su-user').value||'').trim().toLowerCase();
    const role = document.getElementById('su-role').value;
    const pass = document.getElementById('su-pass').value||'';
    if(!nome || !username || !pass){ toast('Preencha todos os campos', true); return; }
    if(pass.length < 4){ toast('Senha muito curta (mín. 4)', true); return; }
    if(!/^[a-z0-9._-]{3,}$/i.test(username)){ toast('Usuário: letras, números, . _ -', true); return; }
    signup.disabled = true; signup.textContent = 'Criando...';
    try {
      const passwordHash = await hashPassword(pass);
      const j = await apiRegister({ nome, username, role, passwordHash });
      state.user = j.user; state.token = j.token; saveLocal();
      toast(j.firstAdmin ? 'Conta criada — você é o Administrador!' : 'Conta criada com sucesso!');
      await reloadPatients(); render();
    } catch(err){ toast('Erro: '+err.message, true); signup.disabled=false; signup.textContent='Criar conta'; }
  };

  const rst = document.getElementById('reset-api');
  if(rst) rst.onclick = () => { state.apiUrl=''; saveLocal(); render(); };
}

/* ---------- Shell (sidebar + topbar + view) ---------- */
function viewShell(){
  return `
  <div class="flex min-h-screen">
    ${sidebar()}
    <div class="flex-1 flex flex-col min-w-0">
      ${topbar()}
      <main class="flex-1 overflow-auto scroll">${currentView()}</main>
    </div>
  </div>`;
}

function sidebar(){
  const items = [
    ['dashboard','Dashboard','📊'],
    ['triagem','Triagem','📋'],
    ['pacientes','Pacientes','👥'],
    ['consulta','Consulta','🩺'],
  ];
  return `
  <aside class="w-[240px] shrink-0 border-r border-border bg-card flex flex-col">
    <div class="h-16 flex items-center px-4 border-b border-border gap-3">
      <div class="h-9 w-9 rounded-lg grid place-items-center border border-gold" style="background:linear-gradient(135deg,#1a1a1a,#0a0a0a)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8A74E" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div>
        <div class="font-serif text-sm gold-gradient tracking-[.25em]">ESSENCIALY</div>
        <div class="text-[9px] uppercase tracking-[.2em] text-muted">Optometria</div>
      </div>
    </div>
    <nav class="p-3 flex-1 space-y-1">
      ${items.map(([k,l,i]) => `<button data-view="${k}" class="side-btn ${state.view===k?'active':''}"><span>${i}</span><span>${l}</span></button>`).join('')}
    </nav>
    <div class="p-3 border-t border-border">
      <div class="rounded-lg bg-black/30 p-2 mb-2">
        <div class="text-[10px] uppercase tracking-widest text-muted">Conectado como</div>
        <div class="text-sm font-medium truncate">${esc(state.user.nome)}</div>
        <div class="text-[10px] uppercase tracking-widest text-gold">@${esc(state.user.username)} · ${ROLES[state.user.role]?.label||''}</div>
      </div>
      <button id="btn-logout" class="side-btn"><span>⏻</span><span>Sair</span></button>
    </div>
  </aside>`;
}

function topbar(){
  return `
  <header class="h-16 border-b border-border bg-card/60 px-6 flex items-center gap-4">
    <div class="flex-1 max-w-xl">
      <input id="search" placeholder="🔍  Buscar por nome, CPF, telefone, cidade..." class="input" value="${esc(state.searchQ)}" />
    </div>
    <button id="btn-new-triagem" class="btn-primary px-4 py-2 rounded-lg text-sm">＋ Nova Triagem</button>
    <button id="btn-reload" class="btn-outline px-3 py-2 rounded-lg text-sm" title="Recarregar da planilha">↻</button>
  </header>`;
}

function currentView(){
  switch(state.view){
    case 'dashboard': return viewDashboard();
    case 'triagem': return viewTriagem();
    case 'pacientes': return viewPacientes();
    case 'consulta': return viewConsulta();
    default: return viewDashboard();
  }
}

function attachShellEvents(){
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
  const s = document.getElementById('search'); if(s) s.oninput = e => { state.searchQ = e.target.value; if(state.view!=='pacientes') state.view='pacientes'; render(); document.getElementById('search').focus(); };
  const nt = document.getElementById('btn-new-triagem'); if(nt) nt.onclick = () => { state.triagemForm=emptyPatient(); state.triagemTab='dados'; state.view='triagem'; render(); };
  const rl = document.getElementById('btn-reload'); if(rl) rl.onclick = reloadPatients;
  const lo = document.getElementById('btn-logout'); if(lo) lo.onclick = () => { state.user=null; state.token=''; saveLocal(); render(); };
  attachViewEvents();
}

/* ---------- Dashboard ---------- */
function viewDashboard(){
  const today = new Date().toISOString().slice(0,10);
  const total = state.patients.length;
  const novos = state.patients.filter(p => (String(p.dataCadastro||'').slice(0,10) === today)).length;
  const aguardando = state.patients.filter(p => ['AGUARDANDO_TRIAGEM','EM_ATENDIMENTO'].includes(p.status)).length;
  const finalizados = state.patients.filter(p => p.status==='FINALIZADO').length;
  const receitas = state.patients.filter(p => p.esfAtualOd || p.esfAtualOe).length;
  const latest = [...state.patients].sort((a,b)=> String(b.dataCadastro||'').localeCompare(String(a.dataCadastro||''))).slice(0,6);

  const stat = (l,v,h) => `
    <div class="luxury rounded-xl p-5">
      <div class="label">${l}</div>
      <div class="font-serif text-4xl mt-1 gold-gradient">${v}</div>
      <div class="text-xs text-muted mt-2">${h||''}</div>
    </div>`;

  return `
  <div class="p-6 space-y-6">
    <div>
      <div class="label">Bem-vindo(a)</div>
      <h1 class="font-serif text-4xl">Painel <span class="gold-gradient">ESSENCIALY</span></h1>
      <p class="text-sm text-muted mt-1">Visão geral da clínica — dados em tempo real da sua planilha Google.</p>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
      ${stat('Pacientes Hoje', novos, 'Novos cadastros')}
      ${stat('Aguardando', aguardando, 'Fila da clínica')}
      ${stat('Finalizados', finalizados, 'Consultas concluídas')}
      ${stat('Receitas', receitas, 'Emitidas')}
      ${stat('Total Pacientes', total, 'Base ativa')}
    </div>
    <div class="luxury rounded-xl p-5">
      <h2 class="font-serif text-xl mb-3">Últimos pacientes</h2>
      ${latest.length===0
        ? `<div class="text-center py-8">
             <p class="text-muted text-sm">Nenhum paciente ainda.</p>
             <button id="dash-new" class="btn-primary px-4 py-2 rounded-lg text-sm mt-3">＋ Criar primeira triagem</button>
           </div>`
        : `<div class="space-y-2">${latest.map(p => `
            <button data-open-patient="${p.id}" class="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 text-left">
              <div class="h-9 w-9 rounded-full bg-gold/10 border border-gold grid place-items-center text-gold text-sm font-medium">${esc((p.nome||'?').slice(0,1).toUpperCase())}</div>
              <div class="flex-1 min-w-0"><div class="text-sm">${esc(p.nome)}</div><div class="text-xs text-muted">${esc(p.telefone||p.cpf||'—')}</div></div>
              <span class="badge ${STATUS_META[p.status]?.cls||'b-gold'}">${STATUS_META[p.status]?.label||p.status||'—'}</span>
            </button>`).join('')}
          </div>`}
    </div>
    ${state.loading?'<div class="text-center text-sm text-muted">Sincronizando com a planilha…</div>':''}
  </div>`;
}

/* =====================================================================
   Event attachment per view
   ===================================================================== */
function attachViewEvents(){
  // triagem
  if(state.view==='triagem'){
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.triagemTab = b.dataset.tab; render(); });
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { const k=b.dataset.toggle; state.triagemForm[k] = !state.triagemForm[k]; render(); });
    document.querySelectorAll('#triagem-form [data-field]').forEach(el => el.oninput = () => { state.triagemForm[el.dataset.field] = el.value; if(el.dataset.field==='dataNascimento'){ render(); document.querySelector('[data-field=dataNascimento]')?.focus(); } });
    document.getElementById('triagem-form').onsubmit = async e => {
      e.preventDefault();
      const f = state.triagemForm;
      if(!f.nome){ toast('Informe o nome', true); return; }
      try {
        // dedupe by CPF
        if(f.cpf){
          const existing = state.patients.find(x => x.cpf && x.cpf===f.cpf);
          if(existing){ f.id = existing.id; f.dataCadastro = existing.dataCadastro; }
        }
        if(!f.id) f.dataCadastro = new Date().toISOString();
        const saved = await apiUpsertPatient(f);
        toast('Paciente salvo na planilha!');
        state.triagemForm = emptyPatient();
        state.triagemTab = 'dados';
        await reloadPatients();
        state.view = 'pacientes'; render();
      } catch(err){ toast('Erro: '+err.message, true); }
    };
  }
  // pacientes
  document.querySelectorAll('[data-open-patient]').forEach(b => b.onclick = () => { state.detailPatientId = b.dataset.openPatient; render(); });
  document.querySelectorAll('[data-consult-patient]').forEach(b => b.onclick = () => { state.selectedPatientId = b.dataset.consultPatient; state.consultForm=null; state.view='consulta'; render(); });
  const dashNew = document.getElementById('dash-new'); if(dashNew) dashNew.onclick = () => { state.triagemForm=emptyPatient(); state.view='triagem'; render(); };
  const closeDet = document.getElementById('close-detail'); if(closeDet) closeDet.onclick = () => { state.detailPatientId=null; render(); };

  // consulta
  if(state.view==='consulta' && state.consultForm){
    document.querySelectorAll('#app [data-field]').forEach(el => el.oninput = () => { state.consultForm[el.dataset.field] = el.value; });
    const back = document.getElementById('back-pacientes'); if(back) back.onclick = () => { state.view='pacientes'; render(); };
    const gopac = document.getElementById('go-pacientes'); if(gopac) gopac.onclick = () => { state.view='pacientes'; render(); };
    const saveBtn = document.getElementById('btn-save-consulta');
    if(saveBtn) saveBtn.onclick = async () => {
      try {
        const p = state.consultForm; const orig = p._original||{};
        // Auto-shift: if any Atual field changed from a non-empty original, move original atual → anterior
        const atualKeys = ['esfAtualOd','cilAtualOd','eixAtualOd','esfAtualOe','cilAtualOe','eixAtualOe','addAtual'];
        const antKeys   = ['esfOdAnt','cilOdAnt','eixOdAnt','esfOeAnt','cilOeAnt','eixOeAnt','addAnt'];
        const changed = atualKeys.some(k => (orig[k]||'') !== (p[k]||'') && (orig[k]||'') !== '');
        if(changed){
          atualKeys.forEach((k,i) => { if(orig[k]) p[antKeys[i]] = orig[k]; });
        }
        p.status = 'FINALIZADO';
        const {_original, ...clean} = p;
        const saved = await apiUpsertPatient(clean);
        toast('Consulta salva na planilha!');
        await reloadPatients();
        state.consultForm = null; state.view='pacientes'; render();
      } catch(err){ toast('Erro: '+err.message, true); }
    };
    const printBtn = document.getElementById('btn-print');
    if(printBtn) printBtn.onclick = () => printReceita(state.consultForm, state.user);
  }
}

/* ---------- Impressão de Receita ---------- */
function printReceita(p, user){
  const w = window.open('','_blank','width=800,height=1000');
