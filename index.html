<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESSENCIALY - Sistema Optométrico</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --gold: #C8A74E;
      --gold-dark: #b08d3a;
      --dark: #111111;
    }
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
    
    /* Cores Customizadas Tailwind */
    .text-gold { color: var(--gold); }
    .bg-gold { background-color: var(--gold); }
    .bg-gold:hover { background-color: var(--gold-dark); }
    .border-gold { border-color: var(--gold); }
    
    .bg-dark { background-color: var(--dark); }
    .text-dark { color: var(--dark); }
    
    /* Toasts */
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      background: #10b981; color: white; padding: 12px 24px;
      border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      font-weight: 500; animation: slideUp 0.3s ease forwards;
    }
    .toast.err { background: #ef4444; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    /* Inputs */
    .input-field {
      width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db;
      border-radius: 0.375rem; outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    
    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
      z-index: 50; padding: 1rem;
    }
    .modal-content {
      background: white; border-radius: 0.5rem; width: 100%; max-width: 800px;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    }
    
    /* Status Badges */
    .badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .b-amber { background-color: #fef3c7; color: #92400e; }
    .b-blue { background-color: #dbeafe; color: #1e40af; }
    .b-emerald { background-color: #d1fae5; color: #065f46; }
    
    /* Scrollbar customizada para tabelas */
    .table-container { overflow-x: auto; }
    .table-container::-webkit-scrollbar { height: 8px; }
    .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    /* ===============================================================
       ESSENCIALY — CRM standalone com backend em Google Sheets

       O Apps Script corrigido grava pelo NOME DO CABEÇALHO.
       A ordem das colunas da planilha não precisa ser alterada.
       =============================================================== */

    const STATUS_META = {
      AGUARDANDO_TRIAGEM: { label: 'Aguardando Triagem', cls: 'b-amber' },
      AGUARDANDO_ATENDIMENTO: { label: 'Aguardando Atendimento', cls: 'b-blue' },
      FINALIZADO: { label: 'Finalizado', cls: 'b-emerald' },
      RETORNO_AGENDADO: { label: 'Retorno Agendado', cls: 'b-blue' },
    };
    
    const ROLES = {
      ADMIN: { label: 'Administrador' },
      RECEPCAO: { label: 'Recepção' },
      OPTOMETRISTA: { label: 'Optometrista' },
    };

    const state = {
      user: null, token: '', apiUrl: '', view: 'dashboard', patients: [],
      loading: false, selectedPatientId: null, detailPatientId: null, mobileMenuOpen: false,
      triagemForm: null, triagemTab: 'dados', triagemLookup: '', triagemReturnId: null,
      searchQ: '', consultForm: null, directForm: null, authTab: 'login',
    };

    // ----- UTILS & STATE -----
    function saveLocal() {
      localStorage.setItem('ess_user', JSON.stringify(state.user || null));
      localStorage.setItem('ess_token', state.token || '');
      localStorage.setItem('ess_api', state.apiUrl || '');
    }
    function loadLocal() {
      try { state.user = JSON.parse(localStorage.getItem('ess_user') || 'null'); } catch { state.user = null; }
      state.token = localStorage.getItem('ess_token') || '';
      state.apiUrl = localStorage.getItem('ess_api') || '';
    }
    
    async function hashPassword(pw) {
      const enc = new TextEncoder().encode('essenciary:' + pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function calcAge(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const t = new Date();
      let a = t.getFullYear() - d.getFullYear();
      const m = t.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
      return a >= 0 && a < 130 ? String(a) : '';
    }

    function toast(msg, err = false) {
      const el = document.createElement('div');
      el.className = 'toast ' + (err ? 'err' : '');
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function normalizeCpf(cpf) {
      return String(cpf || '').replace(/\D/g, '').trim();
    }

    function formatDateBr(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if(isNaN(d)) return isoStr;
      return d.toLocaleDateString('pt-BR');
    }

    function emptyPatient() {
      return {
        id: '', nome: '', dataCadastro: '', dataExame: '', cpf: '', rg: '', dataNascimento: '', idade: '', endereco: '', cidade: '', telefone: '', observacao: '', status: 'AGUARDANDO_TRIAGEM',
        dorDeCabeca: false, avPerto: false, avLonge: false, tontura: false, dorOcular: false, fotofobia: false,
        diabetes: false, hipertensao: false, labirintite: false, glaucoma: false, pterigio: false, cirurgiaNosOlhos: false,
        diabetesFamilia: false, hipertensaoFamilia: false, glaucomaFamilia: false,
        esfOdAnt: '', cilOdAnt: '', eixOdAnt: '', esfOeAnt: '', cilOeAnt: '', eixOeAnt: '', addAnt: '',
        esfAtualOd: '', cilAtualOd: '', eixAtualOd: '', esfAtualOe: '', cilAtualOe: '', eixAtualOe: '', addAtual: '',
        acuidadeLongeOd: '', acuidadePertoOd: '', acuidadeLongeOe: '', acuidadePertoOe: '',
        biocromoVerde: '', biocromoVermelho: ''
      };
    }

    const BOOL_FIELDS = [
      'dorDeCabeca', 'avPerto', 'avLonge', 'tontura', 'dorOcular', 'fotofobia',
      'diabetes', 'hipertensao', 'labirintite', 'glaucoma', 'pterigio', 'cirurgiaNosOlhos',
      'diabetesFamilia', 'hipertensaoFamilia', 'glaucomaFamilia'
    ];

    const TRIAGEM_LABELS = {
      dorDeCabeca: 'Dor de Cabeça', avPerto: 'Baixa AV para Perto', avLonge: 'Baixa AV para Longe',
      tontura: 'Tontura / Náusea', dorOcular: 'Dor Ocular / Cansaço', fotofobia: 'Fotofobia (Luz)',
      diabetes: 'Diabetes', hipertensao: 'Hipertensão (Pressão Alta)', labirintite: 'Labirintite',
      glaucoma: 'Glaucoma', pterigio: 'Pterígio', cirurgiaNosOlhos: 'Cirurgia nos Olhos',
      diabetesFamilia: 'Diabetes na Família', hipertensaoFamilia: 'Hipertensão na Família', glaucomaFamilia: 'Glaucoma na Família'
    };

    const TRIAGEM_QUEIXAS_KEYS = ['dorDeCabeca','avPerto','avLonge','tontura','dorOcular','fotofobia'];
    const TRIAGEM_SAUDE_KEYS = ['diabetes','hipertensao','labirintite','glaucoma','pterigio','cirurgiaNosOlhos'];
    const TRIAGEM_FAMILIA_KEYS = ['diabetesFamilia','hipertensaoFamilia','glaucomaFamilia'];

    function renderTriagemBadges(p, keys) {
      return keys.map(k => `<span class="px-2 py-1 rounded-full text-xs font-medium ${p[k] ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-gray-100 text-gray-400 border border-gray-200 line-through'}">${TRIAGEM_LABELS[k]}</span>`).join('');
    }
    
    function normalizeFromSheet(p) {
      const o = { ...p };
      BOOL_FIELDS.forEach(k => { o[k] = (p[k] === true || String(p[k] || '').toUpperCase() === 'SIM'); });
      return o;
    }

    // ----- VALIDAÇÃO DE RECEITA -----
    function validarReceita(f) {
      const rx = /^[-+]/;
      const isValid = (v) => {
        const val = String(v || '').trim().toUpperCase();
        if (!val || val === 'PL' || val === 'PLANO' || val === '0') return true;
        return rx.test(val);
      };
      
      if (!isValid(f.esfAtualOd)) return "Faltou o sinal (+ ou -) no Esférico OD.";
      if (!isValid(f.cilAtualOd)) return "Faltou o sinal (+ ou -) no Cilíndrico OD.";
      if (!isValid(f.esfAtualOe)) return "Faltou o sinal (+ ou -) no Esférico OE.";
      if (!isValid(f.cilAtualOe)) return "Faltou o sinal (+ ou -) no Cilíndrico OE.";
      
      if (String(f.cilAtualOd || '').trim() && !String(f.eixAtualOd || '').trim()) return "Eixo OD é obrigatório quando há grau Cilíndrico OD.";
      if (String(f.cilAtualOe || '').trim() && !String(f.eixAtualOe || '').trim()) return "Eixo OE é obrigatório quando há grau Cilíndrico OE.";
      
      return null;
    }

    // ----- API FETCHES -----
    function _wait(ms) { return new Promise(res => setTimeout(res, ms)); }

    // Faz fetch + parse de JSON com retentativas automáticas.
    // O Apps Script às vezes "acorda" devagar (cold start) e, logo após o login,
    // a primeira requisição seguinte pode voltar com uma página HTML temporária
    // em vez do JSON — por isso tentamos de novo antes de mostrar erro ao usuário.
    async function _fetchJsonWithRetry(url, options, retries) {
      if (retries === undefined) retries = 2;

      for (let attempt = 0; attempt <= retries; attempt++) {
        let text;

        try {
          const r = await fetch(url, options);
          text = await r.text();
        } catch (networkErr) {
          if (attempt < retries) { await _wait(700 * (attempt + 1)); continue; }
          throw new Error('Falha de conexão com a planilha. Verifique sua internet e tente novamente.');
        }

        try {
          return JSON.parse(text);
        } catch (parseErr) {
          if (attempt < retries) { await _wait(700 * (attempt + 1)); continue; }

          if (/^\s*<(!doctype|html)/i.test(text)) {
            throw new Error(
              'A planilha (Google Apps Script) demorou para responder e não retornou os dados a tempo. ' +
              'Isso costuma acontecer quando ela estava "dormindo" (sem uso recente). Toque em Atualizar e tente de novo.'
            );
          }

          throw new Error('Resposta inesperada do servidor: ' + text.slice(0, 150));
        }
      }
    }

    async function apiPost(payload) {
      if (!state.apiUrl) throw new Error('URL da API não configurada');
      return await _fetchJsonWithRetry(state.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    }
    
    function handleAuthExpired() {
      state.user = null; state.token = ''; saveLocal();
      toast('Sessão expirada — faça login novamente', true);
      render();
    }

    async function apiGetPatients() {
      if (!state.apiUrl) return [];
      const j = await _fetchJsonWithRetry(state.apiUrl + '?token=' + encodeURIComponent(state.token), { method: 'GET' });
      if (!j.ok) { if (j.error === 'auth') handleAuthExpired(); throw new Error(j.error || 'Erro ao buscar'); }
      return (j.patients || []).map(normalizeFromSheet);
    }
    
    async function apiUpsertPatient(patient) {
      const j = await apiPost({ action: 'upsert', token: state.token, patient });
      if (!j.ok) { if (j.error === 'auth') handleAuthExpired(); throw new Error(j.error || 'Erro ao salvar paciente'); }
      return j.patient;
    }
    
    async function apiSaveRecipe(recipe) {
      const j = await apiPost({ action: 'saveRecipe', token: state.token, recipe });
      if (!j.ok) { if (j.error === 'auth') handleAuthExpired(); throw new Error(j.error || 'Erro ao salvar receita'); }
      return j.recipe;
    }

    async function apiDeletePatient(patientId) {
      const j = await apiPost({ action: 'deletePatient', token: state.token, patientId });
      if (!j.ok) { if (j.error === 'auth') handleAuthExpired(); throw new Error(j.error || 'Erro ao excluir paciente'); }
      return j;
    }
    
    async function apiRegister(user) {
      const j = await apiPost({ action: 'register', user });
      if (!j.ok) throw new Error(j.error || 'Erro no cadastro');
      return j;
    }
    
    async function apiLogin(username, passwordHash) {
      const j = await apiPost({ action: 'login', username, passwordHash });
      if (!j.ok) throw new Error(j.error || 'Falha ao entrar');
      return j;
    }

    async function reloadPatients() {
      try {
        state.loading = true; render();
        state.patients = await apiGetPatients();
      } catch (e) { toast('Erro: ' + e.message, true); }
      finally { state.loading = false; render(); }
    }

    async function ensureLegacyRecipe(patient) {
      const hasHistory = Array.isArray(patient.receitas) && patient.receitas.length;
      const hasCurrent = patient.esfAtualOd || patient.esfAtualOe || patient.addAtual || patient.dataExame;
      if (hasHistory || !hasCurrent) return;
      const recipe = { ...patient };

      delete recipe.receitas;
      delete recipe._original;

      recipe.patientId = patient.id;
      recipe.id = '';
      recipe.dataExame =
        patient.dataExame ||
        String(patient.dataCadastro || '').slice(0, 10);
      recipe.dataCadastro = new Date().toISOString();
      recipe.criadoPorId = state.user?.id || '';
      recipe.criadoPorNome = state.user?.nome || '';
      recipe.legado = true;

      await apiSaveRecipe(recipe);
    }

    // ----- VIEWS -----
    function viewSetup() {
      return `
        <div class="flex-1 flex items-center justify-center bg-dark p-4">
          <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md text-center">
            <h1 class="text-3xl font-bold text-gold mb-2">ESSENCIALY</h1>
            <p class="text-gray-500 mb-6">Configuração do Sistema</p>
            <div class="mb-4 text-left">
              <label class="block text-sm font-medium text-gray-700 mb-1">URL do Google Apps Script</label>
              <input type="text" id="api-url" class="input-field" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <button id="save-api" class="w-full bg-gold text-white font-bold py-2 px-4 rounded hover:bg-yellow-600 transition">Conectar</button>
          </div>
        </div>
      `;
    }

    function viewLogin() {
      const isLogin = state.authTab === 'login';
      return `
        <div class="flex-1 flex items-center justify-center bg-dark p-4">
          <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-dark p-6 text-center border-b border-gold border-opacity-30">
              <h1 class="text-3xl font-bold text-gold">ESSENCIALY</h1>
              <p class="text-gray-400 text-sm mt-1">Ótica & Optometria</p>
            </div>
            <div class="flex border-b border-gray-200">
              <button class="flex-1 py-3 font-semibold ${isLogin ? 'text-gold border-b-2 border-gold' : 'text-gray-500 hover:text-gray-700'}" id="tab-login">Entrar</button>
              <button class="flex-1 py-3 font-semibold ${!isLogin ? 'text-gold border-b-2 border-gold' : 'text-gray-500 hover:text-gray-700'}" id="tab-register">Cadastrar</button>
            </div>
            <div class="p-6">
              <form id="auth-form" class="space-y-4">
                ${!isLogin ? `
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="auth-nome" required class="input-field" placeholder="Ex: João Silva">
                  </div>
                ` : ''}
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
                  <input type="text" id="auth-user" required class="input-field" placeholder="usuario">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                  <input type="password" id="auth-pass" required class="input-field" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-gold text-white font-bold py-2 px-4 rounded transition mt-4">
                  ${isLogin ? 'Acessar Sistema' : 'Criar Conta'}
                </button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function toggleMobileMenu() {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      render();
    }

    function closeMobileMenu() {
      if (state.mobileMenuOpen) { state.mobileMenuOpen = false; render(); }
    }

    function viewShell() {
      return `
        <div class="flex h-screen overflow-hidden bg-gray-100">
          <aside class="fixed md:static inset-y-0 left-0 z-50 w-72 max-w-[80vw] md:w-64 md:max-w-none bg-dark text-white flex flex-col transform transition-transform duration-300 ease-in-out ${state.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0">
            <div class="p-6 flex items-center justify-between border-b border-gray-800">
              <h2 class="text-2xl font-bold text-gold">ESSENCIALY</h2>
              <button data-close-mobile-menu class="md:hidden text-gray-400 hover:text-white p-1"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <nav class="flex-1 p-4 space-y-2">
              <a href="#" data-nav="dashboard" class="flex items-center gap-3 p-3 rounded-lg transition ${state.view==='dashboard'?'bg-gray-800 text-gold':'hover:bg-gray-800 text-gray-300'}"><i class="ph ph-squares-four text-xl"></i> Dashboard</a>
              <a href="#" data-nav="pacientes" class="flex items-center gap-3 p-3 rounded-lg transition ${state.view==='pacientes'?'bg-gray-800 text-gold':'hover:bg-gray-800 text-gray-300'}"><i class="ph ph-users text-xl"></i> Pacientes</a>
              <a href="#" data-nav="triagem" class="flex items-center gap-3 p-3 rounded-lg transition ${state.view==='triagem'?'bg-gray-800 text-gold':'hover:bg-gray-800 text-gray-300'}"><i class="ph ph-clipboard-text text-xl"></i> Triagem</a>
              <a href="#" data-nav="cadastroReceita" class="flex items-center gap-3 p-3 rounded-lg transition ${state.view==='cadastroReceita'?'bg-gray-800 text-gold':'hover:bg-gray-800 text-gray-300'}"><i class="ph ph-file-plus text-xl"></i> Cadastro Direto</a>
            </nav>
            <div class="p-4 border-t border-gray-800">
              <button id="btn-logout" class="w-full flex items-center justify-center gap-2 p-2 rounded text-gray-400 hover:text-white hover:bg-gray-800 transition">
                <i class="ph ph-sign-out"></i> Sair
              </button>
            </div>
          </aside>
          
          ${state.mobileMenuOpen ? `<div data-mobile-overlay class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"></div>` : ''}
          
          <div class="flex-1 flex flex-col w-full h-full min-w-0">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-4 sm:px-6 z-10 shrink-0">
              <div class="flex items-center gap-3">
                <button data-open-mobile-menu class="md:hidden text-gray-600 p-1 -ml-1"><i class="ph ph-list text-2xl"></i></button>
                <h2 class="text-xl font-bold text-gold md:hidden">ESSENCIALY</h2>
                <div class="hidden md:block font-medium text-gray-600">
                  Visão: <span class="capitalize text-gold">${state.view.replace(/([A-Z])/g, ' $1').trim()}</span>
                </div>
              </div>
              <div class="flex items-center gap-3 sm:gap-4">
                <div class="text-sm text-right hidden sm:block">
                  <p class="font-bold text-gray-800">${esc(state.user.nome)}</p>
                  <p class="text-xs text-gray-500">${ROLES[state.user.role]?.label || state.user.role}</p>
                </div>
                <div class="w-10 h-10 shrink-0 bg-gold rounded-full flex items-center justify-center text-white font-bold uppercase">
                  ${esc(state.user.nome.charAt(0))}
                </div>
              </div>
            </header>
            
            <main class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-6 relative">
              ${state.loading ? `<div class="absolute inset-0 bg-white bg-opacity-70 flex items-center justify-center z-40"><i class="ph ph-spinner-gap animate-spin text-4xl text-gold"></i></div>` : ''}
              ${renderMainContent()}
            </main>
          </div>
        </div>
        ${state.detailPatientId ? modalPatientDetail() : ''}
      `;
    }

    function renderMainContent() {
      if (state.view === 'dashboard') return viewDashboard();
      if (state.view === 'pacientes') return viewPacientes();
      if (state.view === 'triagem') return viewTriagem();
      if (state.view === 'cadastroReceita') return viewCadastroReceita();
      if (state.view === 'consulta') return viewConsulta();
      return `<div>View não encontrada</div>`;
    }

    function localTodayISO() {
      const d = new Date();
      const tz = d.getTimezoneOffset() * 60000;
      return new Date(d - tz).toISOString().slice(0, 10);
    }

    function addOneYearISO(dateStr) {
      const s = String(dateStr || '').slice(0, 10);
      const parts = s.split('-');
      if (parts.length !== 3) return '';
      const y = parseInt(parts[0], 10);
      if (!y) return '';
      return `${y + 1}-${parts[1]}-${parts[2]}`;
    }

    function viewDashboard() {
      const pts = state.patients;
      const triagem = pts.filter(p => p.status === 'AGUARDANDO_TRIAGEM').length;
      const atendimento = pts.filter(p => p.status === 'AGUARDANDO_ATENDIMENTO').length;
      const finalizados = pts.filter(p => p.status === 'FINALIZADO').length;

      const localToday = localTodayISO();
      const todayMonthDay = localToday.slice(5, 10);
      const todayYearMonth = localToday.slice(0, 7);

      // Todas as receitas/consultas de todos os pacientes, com referência ao paciente
      const allRecipes = pts.flatMap(p =>
        (Array.isArray(p.receitas) ? p.receitas : []).map(r => ({ ...r, _patientNome: p.nome, _patientId: p.id }))
      );

      // Aniversariantes do dia (usa a data de nascimento do paciente)
      const aniversariantes = pts.filter(p => p.dataNascimento && String(p.dataNascimento).slice(5, 10) === todayMonthDay);

      // Consultas realizadas hoje / no mês (com base na data do exame de cada receita)
      const consultasHoje = allRecipes.filter(r => String(r.dataExame || '').slice(0, 10) === localToday);
      const consultasMes = allRecipes.filter(r => String(r.dataExame || '').slice(0, 7) === todayYearMonth);

      // Receitas vencendo hoje: paciente cuja última consulta completou exatamente 1 ano hoje
      const receitasVencendo = pts.filter(p => {
        const latest = Array.isArray(p.receitas) && p.receitas.length > 0
          ? [...p.receitas].sort((a, b) => String(b.dataExame || '').localeCompare(String(a.dataExame || '')))[0]
          : null;
        const lastExamDate = latest?.dataExame || p.dataExame || '';
        if (!lastExamDate) return false;
        return addOneYearISO(lastExamDate) === localToday;
      }).map(p => {
        const latest = Array.isArray(p.receitas) && p.receitas.length > 0
          ? [...p.receitas].sort((a, b) => String(b.dataExame || '').localeCompare(String(a.dataExame || '')))[0]
          : null;
        return { patient: p, lastExamDate: latest?.dataExame || p.dataExame || '' };

        String(x.id || '').trim() === String(state.selectedPatientId || '').trim()

      if (!pOrig) return `<div class="p-4 text-red-500">Paciente não encontrado.</div>`;
      
      if (!state.consultForm) {
        state.consultForm = JSON.parse(JSON.stringify(pOrig));
        state.consultForm._original = pOrig;
        ['esfAtualOd','cilAtualOd','eixAtualOd','esfAtualOe','cilAtualOe','eixAtualOe','addAtual','acuidadeLongeOd','acuidadePertoOd','acuidadeLongeOe','acuidadePertoOe','biocromoVerde','biocromoVermelho'].forEach(k => { state.consultForm[k] = ''; });

        // Pré-preenche a Lensometria com o último grau conhecido do paciente (editável pelo optometrista)
        const hLatestInit = (pOrig.receitas && pOrig.receitas.length > 0) ? [...pOrig.receitas].sort((a,b)=>String(b.dataExame||'').localeCompare(String(a.dataExame||'')))[0] : pOrig;

        state.consultForm.cilOdAnt = hLatestInit.cilAtualOd || hLatestInit.cilOdAnt || '';
        state.consultForm.eixOdAnt = hLatestInit.eixAtualOd || hLatestInit.eixOdAnt || '';
        state.consultForm.esfOeAnt = hLatestInit.esfAtualOe || hLatestInit.esfOeAnt || '';
        state.consultForm.cilOeAnt = hLatestInit.cilAtualOe || hLatestInit.cilOeAnt || '';
        state.consultForm.eixOeAnt = hLatestInit.eixAtualOe || hLatestInit.eixOeAnt || '';
        state.consultForm.addAnt = hLatestInit.addAtual || hLatestInit.addAnt || '';

      const p = state.consultForm;

      return `

                  <p class="text-xs font-semibold text-gray-500 uppercase mb-2">Dados Pessoais</p>

                  <p class="mb-1"><span class="text-gray-500">RG:</span> ${esc(p.rg)||'-'}</p>
                  <p class="mb-1"><span class="text-gray-500">Telefone:</span> ${esc(p.telefone)||'-'}</p>
                  <p class="mb-1"><span class="text-gray-500">Cidade/Estado:</span> ${esc(p.cidade)||'-'}</p>

                <div>

    // ----- EVENTS & LIFECYCLE -----
    function attachSetupEvents() {
      const btn = document.getElementById('save-api');
      if (btn) btn.onclick = async () => {
        const v = document.getElementById('api-url').value.trim();
        if (!v || !v.includes('/exec')) { toast('URL inválida — precisa terminar em /exec', true); return; }

        btn.disabled = true;
        btn.textContent = 'Testando conexão...';
        try {
          const j = await _fetchJsonWithRetry(v + '?token=teste', { method: 'GET' });
          // Qualquer resposta JSON válida (mesmo { ok:false, error:'auth' }) confirma que a implantação está acessível.
          if (typeof j.ok === 'undefined') {
            throw new Error('A URL respondeu, mas não parece ser a API do ESSENCIALY.');
          }
          state.apiUrl = v; saveLocal(); toast('Planilha conectada!'); render();
        } catch (err) {
          toast(err.message, true);
          btn.disabled = false;
          btn.textContent = 'Conectar';
        }
      };
    }

    function attachLoginEvents() {
      document.getElementById('tab-login').onclick = () => { state.authTab = 'login'; render(); };
      document.getElementById('tab-register').onclick = () => { state.authTab = 'register'; render(); };
      
      document.getElementById('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        try {
          const u = document.getElementById('auth-user').value.trim();
          const p = document.getElementById('auth-pass').value.trim();
          const passHash = await hashPassword(p);
          
          if (state.authTab === 'login') {
            const res = await apiLogin(u, passHash);
            state.user = res.user; state.token = res.token; saveLocal();
            toast('Login efetuado com sucesso!'); render();
            reloadPatients();
          } else {
            const n = document.getElementById('auth-nome').value.trim();
            const res = await apiRegister({ username: u, nome: n, passwordHash: passHash, role: 'RECEPCAO' });
            state.user = res.user; state.token = res.token; saveLocal();
            toast(res.firstAdmin ? 'Conta Admin criada!' : 'Conta criada!'); render();
            reloadPatients();
          }
        } catch (err) { toast(err.message, true); }
      };
    }

    function attachShellEvents() {
      document.getElementById('btn-logout').onclick = () => {
        state.user = null; state.token = ''; saveLocal(); state.view = 'dashboard'; render();
      };
      document.querySelectorAll('[data-nav]').forEach(el => {
        el.onclick = (e) => { e.preventDefault(); state.view = el.dataset.nav; state.mobileMenuOpen = false; render(); };
      });

      const btnOpenMenu = document.querySelector('[data-open-mobile-menu]');
      if (btnOpenMenu) btnOpenMenu.onclick = toggleMobileMenu;

      const btnCloseMenu = document.querySelector('[data-close-mobile-menu]');
      if (btnCloseMenu) btnCloseMenu.onclick = closeMobileMenu;

      const overlay = document.querySelector('[data-mobile-overlay]');
      if (overlay) overlay.onclick = closeMobileMenu;
      
      const searchInput = document.getElementById('search-patients');
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.searchQ = e.target.value;
          render();
        };
      }
      
      attachViewEvents();
    }

    function attachViewEvents() {
      const btnTriagemSearch = document.getElementById('btn-triagem-search');
      if(btnTriagemSearch) btnTriagemSearch.onclick = () => {
        const inputCpf = normalizeCpf(
          document.getElementById('triagem-search').value
        );

        if (!inputCpf) {
          toast('Digite um CPF para buscar', true);
          return;
        }

        const p = state.patients.find(
          x => normalizeCpf(x.cpf) === inputCpf
        );
        
        if(p) { 
          state.triagemForm = JSON.parse(JSON.stringify(p)); 
          state.triagemReturnId = p.id; 
          toast('Paciente encontrado!'); 
          render(); 
        } else { 
          toast('Paciente não encontrado. Verifique os números.', true); 
        }
      };

      if(state.view === 'triagem'){
        document.querySelectorAll('#triagem-form [data-triagem]').forEach(el => el.onchange = el.oninput = () => {
          if (el.type === 'checkbox') state.triagemForm[el.dataset.triagem] = el.checked;
          else {
            state.triagemForm[el.dataset.triagem] = el.value;
            if (el.dataset.triagem === 'dataNascimento') {
              state.triagemForm.idade = calcAge(el.value);
              const ageEl = document.querySelector('[data-age-display]');
              if (ageEl) ageEl.value = state.triagemForm.idade;
            }
          }
        });

        document.getElementById('triagem-form').onsubmit = async e => {
          e.preventDefault();
          const f = state.triagemForm;
          f.cpf = normalizeCpf(f.cpf);

          if (!f.nome) { toast('Informe o nome', true); return; }
          try {
            if (!state.triagemReturnId && f.cpf) {
              const cpfBusca = normalizeCpf(f.cpf);

              const existing = state.patients.find(
                x => normalizeCpf(x.cpf) === cpfBusca
              );

              if (existing) {
                f.id = existing.id;
                f.dataCadastro = existing.dataCadastro;
              }
            }
            if (!f.id) f.dataCadastro = new Date().toISOString();
            f.idade = calcAge(f.dataNascimento);
            f.status = 'AGUARDANDO_ATENDIMENTO';
            
            await apiUpsertPatient(f); 
            toast(state.triagemReturnId ? 'Retorno enviado para fila!' : 'Paciente cadastrado e na fila!');
            state.triagemForm = emptyPatient(); state.triagemReturnId = null; state.triagemTab = 'dados';
            await reloadPatients();
            state.view = 'dashboard'; render();
          } catch (err) { toast('Erro: ' + err.message, true); }
        };
      }

      if (state.view === 'consulta' && state.consultForm) {
        document.querySelectorAll('#app [data-field]').forEach(el => el.oninput = () => { state.consultForm[el.dataset.field] = el.value; });
        const consultaDate = document.getElementById('consulta-data-exame');
        if (consultaDate) consultaDate.oninput = () => { state.consultForm.dataExame = consultaDate.value; };
        
        const saveBtn = document.getElementById('btn-save-consulta');
        if (saveBtn) saveBtn.onclick = async () => {
          
          const errorMsg = validarReceita(state.consultForm);
          if (errorMsg) { alert(errorMsg); return; }

          try {
            const p = state.consultForm; const orig = p._original || {};
            const dataExame = document.getElementById('consulta-data-exame')?.value || '';
            if (!dataExame) { toast('Informe a data do exame', true); return; }
            
            const atualKeys = ['esfAtualOd','cilAtualOd','eixAtualOd','esfAtualOe','cilAtualOe','eixAtualOe','addAtual'];
            const antKeys = ['esfOdAnt','cilOdAnt','eixOdAnt','esfOeAnt','cilOeAnt','eixOeAnt','addAnt'];
            
            const latest = Array.isArray(p.receitas) && p.receitas.length > 0 ? [...p.receitas].sort((a,b)=>String(b.dataExame||'').localeCompare(String(a.dataExame||'')))[0] : null;
            if (!latest) await ensureLegacyRecipe(orig);
            const previous = latest || orig;
            
            const recipe = { ...p };

            delete recipe.receitas;
            delete recipe._original;

            recipe.patientId = p.id;
            recipe.id = '';
            recipe.dataExame = dataExame;
            recipe.dataCadastro = new Date().toISOString();
            recipe.criadoPorId = state.user?.id || '';
            recipe.criadoPorNome = state.user?.nome || '';

            atualKeys.forEach((k, i) => {
              recipe[antKeys[i]] =
                p[antKeys[i]] ||
                previous?.[k] ||
                previous?.[antKeys[i]] ||
                '';
            });

            await apiSaveRecipe(recipe);
            
            const master = { ...orig };

            delete master.receitas;
            delete master._original;

            atualKeys.forEach(k => {
              master[k] = p[k] || '';
            });

            master.dataExame = dataExame;
            master.idade = calcAge(p.dataNascimento);
            master.status = 'FINALIZADO';

            await apiUpsertPatient(master);
            
            toast('Nova receita adicionada ao histórico!');
            await reloadPatients();
            state.consultForm = null; state.view = 'pacientes'; render();
          } catch (err) { toast('Erro: ' + err.message, true); }
        };
      }

      if (state.view === 'cadastroReceita' && state.directForm) {
        document.querySelectorAll('#direto-form [data-direct-field]').forEach(el => el.oninput = () => {
          state.directForm[el.dataset.directField] = el.value;
          if (el.dataset.directField === 'dataNascimento') {
            const ageEl = document.querySelector('#direto-form [data-age-display]');
            if (ageEl) ageEl.value = calcAge(el.value);
          }
        });
        
        const cancel = document.getElementById('cancel-direto');
        if (cancel) cancel.onclick = () => { state.directForm = null; state.view = 'pacientes'; render(); };
        
        const form = document.getElementById('direto-form');
        if (form) form.onsubmit = async e => {
          e.preventDefault(); 
          const f = state.directForm;
          
          const errorMsg = validarReceita(f);
          if (errorMsg) { alert(errorMsg); return; }

          if (!f.nome) { toast('Informe o nome', true); return; }
          if (!f.dataExame) { toast('Informe a data do exame', true); return; }
          try {
            let existingPatient = null;

            f.cpf = normalizeCpf(f.cpf);

            if (f.cpf) {
              const cpfBusca = normalizeCpf(f.cpf);

              existingPatient = state.patients.find(
                x => normalizeCpf(x.cpf) === cpfBusca
              );

              if (existingPatient) {
                f.id = existingPatient.id;
                f.dataCadastro = existingPatient.dataCadastro;
              }
            }
            
            if (existingPatient) await ensureLegacyRecipe(existingPatient);
            if (!f.id) f.dataCadastro = new Date().toISOString();
            f.idade = calcAge(f.dataNascimento);
            f.status = 'FINALIZADO';
            
            const saved = await apiUpsertPatient(f);
            
            const recipe = { ...f };

            delete recipe.receitas;
            delete recipe._original;

            recipe.patientId = saved.id || f.id;
            recipe.id = '';
            recipe.dataCadastro = new Date().toISOString();
            recipe.criadoPorId = state.user?.id || '';
            recipe.criadoPorNome = state.user?.nome || '';

            await apiSaveRecipe(recipe);
            
            toast('Paciente e receita salvos!');
            await reloadPatients();
            state.directForm = null; state.view = 'pacientes'; render();
          } catch (err) { toast('Erro: ' + err.message, true); }
        };
      }
      
      document.querySelectorAll('[data-open-patient]').forEach(b => b.onclick = () => { state.detailPatientId = b.dataset.openPatient; render(); });
      document.querySelectorAll('[data-consult-patient]').forEach(b => b.onclick = () => { state.selectedPatientId = b.dataset.consultPatient; state.consultForm = null; state.view = 'consulta'; render(); });
      document.querySelectorAll('[data-delete-patient]').forEach(b => b.onclick = async () => {
        const id = b.dataset.deletePatient;
        const nome = b.dataset.deletePatientNome || 'este paciente';
        if (!confirm(`Tem certeza que deseja excluir ${nome}?\n\nEsta ação vai apagar o cadastro e TODO o histórico de receitas dele. Não pode ser desfeita.`)) return;
        try {
          await apiDeletePatient(id);
          toast('Paciente excluído com sucesso!');
          if (state.detailPatientId === id) state.detailPatientId = null;
          if (state.selectedPatientId === id) state.selectedPatientId = null;
          await reloadPatients();
          render();
        } catch (err) { toast('Erro: ' + err.message, true); }
      });
    }

    // ----- INICIALIZAÇÃO -----
    function render() {
      const root = document.getElementById('app');
      if (!state.apiUrl) { root.innerHTML = viewSetup(); attachSetupEvents(); return; }
      if (!state.user || !state.token) { root.innerHTML = viewLogin(); attachLoginEvents(); return; }
      root.innerHTML = viewShell(); attachShellEvents();
    }

    loadLocal();
    render();
    if (state.user && state.token && state.apiUrl) { reloadPatients(); }
  </script>
</body>
</html>
